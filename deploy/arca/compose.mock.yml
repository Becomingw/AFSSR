services:
  mock-responses:
    image: node:22-bookworm-slim
    command: [node, /work/mock_responses.mjs]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /opt/arca-test-20261016/browser/node_modules:/work/node_modules:ro
      - ./mock_responses.mjs:/work/mock_responses.mjs:ro
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    networks: [acceptance]
  mock-upstream:
    image: node:22-bookworm-slim
    command: [node, /fixture/mock_upstream.mjs]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ./mock_upstream.mjs
        target: /fixture/mock_upstream.mjs
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    networks: [acceptance]

# Arca 本地在线更新联调环境
# 使用当前源码构建一个 release-layout 测试镜像，专门验证管理后台一键更新。
#
# 启动:
#   docker compose -f docker-compose.release-local.yml up -d --build
#
# 重置（删除测试 PostgreSQL 数据、/opt/aether/current 与历史版本目录）:
#   docker compose -f docker-compose.release-local.yml down -v

name: arca-release-local

services:
  postgres:
    # OCI index digest for the official multi-architecture postgres:15.19 image.
    image: postgres:15.19@sha256:5f72c7b5bd616308ccfd2e74d6be16fb06364e5eecbb815fe9dc6ab9761d2111
    container_name: arca-release-local-postgres
    shm_size: ${POSTGRES_SHM_SIZE:-512mb}
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c idle_in_transaction_session_timeout=30000
      -c tcp_keepalives_idle=30
      -c tcp_keepalives_interval=10
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "100m"
        max-file: "3"
        compress: "true"
    restart: unless-stopped

  release-local-app:
    build:
      context: .
      dockerfile: Dockerfile.app.release-local
      args:
        AETHER_BUILD_VERSION: ${AETHER_RELEASE_LOCAL_VERSION:-v0.7.0}
        AETHER_BUILD_TYPE: release
    image: ${LOCAL_RELEASE_APP_IMAGE:-arca-app:release-local}
    container_name: arca-release-local-app
    env_file:
      - ${ARCA_ENV_FILE:-${AETHER_ENV_FILE:-.env}}
    environment:
      TZ: Asia/Shanghai
      ARCA_DATABASE_DRIVER: postgres
      ARCA_DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/aether
      ARCA_RUNTIME_BACKEND: memory
      ARCA_GATEWAY_DEPLOYMENT_TOPOLOGY: single-node
      ARCA_GATEWAY_NODE_ROLE: all
      ARCA_LOG_DESTINATION: ${ARCA_LOG_DESTINATION:-${AETHER_LOG_DESTINATION:-stdout}}
      ARCA_LOG_FORMAT: ${ARCA_LOG_FORMAT:-${AETHER_LOG_FORMAT:-pretty}}
      ARCA_LOG_DIR: ${ARCA_LOG_DIR:-${AETHER_LOG_DIR:-/opt/aether/logs}}
      ARCA_LOG_ROTATION: ${ARCA_LOG_ROTATION:-${AETHER_LOG_ROTATION:-daily}}
      ARCA_LOG_RETENTION_DAYS: ${ARCA_LOG_RETENTION_DAYS:-${AETHER_LOG_RETENTION_DAYS:-7}}
      ARCA_LOG_MAX_FILES: ${ARCA_LOG_MAX_FILES:-${AETHER_LOG_MAX_FILES:-30}}
      APP_PORT: ${ARCA_RELEASE_LOCAL_PORT:-${AETHER_RELEASE_LOCAL_PORT:-18085}}
      ARCA_UPDATE_PROXY_URL: ${ARCA_UPDATE_PROXY_URL:-${AETHER_UPDATE_PROXY_URL:-}}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      ARCA_BASE_DIR: /opt/aether
      ARCA_UPDATE_STRATEGY: self
      ARCA_GATEWAY_AUTO_PREPARE_DATABASE: ${ARCA_GATEWAY_AUTO_PREPARE_DATABASE:-${AETHER_GATEWAY_AUTO_PREPARE_DATABASE:-true}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ARCA_RELEASE_LOCAL_PORT:-${AETHER_RELEASE_LOCAL_PORT:-18085}}:${ARCA_RELEASE_LOCAL_PORT:-${AETHER_RELEASE_LOCAL_PORT:-18085}}"
    volumes:
      - arca_release_local_root:/opt/aether
    restart: unless-stopped

volumes:
  postgres_data:
  arca_release_local_root:
